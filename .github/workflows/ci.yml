name: ci
on: {push: {branches: [main]}, pull_request:}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache: true}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with: {version: v1.62.2}
      - run: go test -race ./...
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, tags: snapvol-csi:ci}
  e2e:
    # kind on GitHub runners works, but CSI bind-mounts in kind are slow/flaky;
    # keep e2e manual/nightly rather than blocking PRs. See hack/e2e-kind.sh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23", cache: true}
      - uses: helm/kind-action@v1
        with: {cluster_name: snapvol}
      - run: ./hack/e2e-kind.sh
