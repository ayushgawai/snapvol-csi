apiVersion: v1
kind: ServiceAccount
metadata: {name: snapvol-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: snapvol-controller}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [create, delete, get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, events, nodes]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments, csidrivers, csinodes]
    verbs: [create, delete, get, list, watch, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots, volumesnapshotcontents, volumesnapshotclasses]
    verbs: [create, delete, get, list, watch, update, patch]
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshotcontents/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: snapvol-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: snapvol-controller}
subjects: [{kind: ServiceAccount, name: snapvol-controller, namespace: '{{ .Release.Namespace }}'}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: snapvol-node}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: snapvol-node}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [create, get, list, update, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: snapvol-node}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: snapvol-node}
subjects: [{kind: ServiceAccount, name: snapvol-node, namespace: '{{ .Release.Namespace }}'}]
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata: {name: csi.snapvol.dev}
spec: {attachRequired: true, podInfoOnMount: false, volumeLifecycleModes: [Persistent]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: snapvol-controller}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector: {matchLabels: {app: snapvol-controller}}
  template:
    metadata: {labels: {app: snapvol-controller}}
    spec:
      serviceAccountName: snapvol-controller
      containers:
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
          args: [--csi-address=/csi/csi.sock, --v=2]
          volumeMounts: [{name: socket, mountPath: /csi}]
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          args: [--csi-address=/csi/csi.sock, --v=2]
          volumeMounts: [{name: socket, mountPath: /csi}]
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
          args: [--csi-address=/csi/csi.sock, --v=2]
          volumeMounts: [{name: socket, mountPath: /csi}]
        - name: snapvol
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          args: [--endpoint=unix:///csi/csi.sock, --data-dir={{ .Values.dataDir }}, --backend={{ .Values.backend }}, --node-id=$(NODE_ID), --http-addr=:9808]
          env: [{name: NODE_ID, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          ports: [{containerPort: 9808, name: metrics}]
          volumeMounts: [{name: socket, mountPath: /csi}, {name: data, mountPath: '{{ .Values.dataDir }}'}]
          livenessProbe: {httpGet: {path: /healthz, port: 9808}}
          readinessProbe: {httpGet: {path: /readyz, port: 9808}}
        - name: controlplane
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          command: [/usr/local/bin/snapvol-controlplane]
          args: [--addr=:8080, --data-dir={{ .Values.dataDir }}, --backend={{ .Values.backend }}, --quota-bytes={{ .Values.quotaBytes }}, --quota-volumes={{ .Values.quotaVolumes }}]
          ports: [{containerPort: 8080, name: api}]
          volumeMounts: [{name: data, mountPath: '{{ .Values.dataDir }}'}]
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
      volumes:
        - {name: socket, emptyDir: {}}
        - {name: data, hostPath: {path: '{{ .Values.dataDir }}', type: DirectoryOrCreate}}
---
apiVersion: v1
kind: Service
metadata: {name: snapvol-controlplane}
spec:
  selector: {app: snapvol-controller}
  ports:
    - {name: api, port: 8080, targetPort: 8080}
    - {name: metrics, port: 9808, targetPort: 9808}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: snapvol-node}
spec:
  selector: {matchLabels: {app: snapvol-node}}
  template:
    metadata: {labels: {app: snapvol-node}}
    spec:
      serviceAccountName: snapvol-node
      tolerations:
        {{- toYaml .Values.node.tolerations | nindent 8 }}
      containers:
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
          args: [--csi-address=/csi/csi.sock, --kubelet-registration-path=/var/lib/kubelet/plugins/csi.snapvol.dev/csi.sock]
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: registration, mountPath: /registration}
        - name: snapvol
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          args: [--endpoint=unix:///csi/csi.sock, --data-dir={{ .Values.dataDir }}, --backend={{ .Values.backend }}, --node-id=$(NODE_ID), --http-addr=:9808]
          env: [{name: NODE_ID, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          securityContext: {privileged: true} # bind mounts
          volumeMounts:
            - {name: socket, mountPath: /csi}
            - {name: kubelet, mountPath: /var/lib/kubelet, mountPropagation: Bidirectional}
            - {name: data, mountPath: '{{ .Values.dataDir }}', mountPropagation: Bidirectional}
      volumes:
        - {name: socket, hostPath: {path: /var/lib/kubelet/plugins/csi.snapvol.dev, type: DirectoryOrCreate}}
        - {name: registration, hostPath: {path: /var/lib/kubelet/plugins_registry, type: Directory}}
        - {name: kubelet, hostPath: {path: /var/lib/kubelet, type: Directory}}
        - {name: data, hostPath: {path: '{{ .Values.dataDir }}', type: DirectoryOrCreate}}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: snapvol}
provisioner: csi.snapvol.dev
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters: {}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata: {name: snapvol}
driver: csi.snapvol.dev
deletionPolicy: Delete
